<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Stash Island</title>
<style>
:root{--ease:cubic-bezier(.32,1.25,.42,1);--soft:cubic-bezier(.16,1,.3,1)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:transparent;overflow:hidden;color:#f2f2f3;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased;user-select:none}
button,input{font:inherit;color:inherit;background:none;border:0;outline:0}

/* ---------- the island: grows out of the notch ---------- */
.wrap{position:absolute;top:0;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center}
.isl{position:relative;width:190px;height:32px;background:#000;border-radius:0 0 18px 18px;overflow:hidden;
  transition:width .55s var(--ease),height .55s var(--ease),border-radius .55s var(--ease),box-shadow .4s;box-shadow:0 0 0 rgba(0,0,0,0)}
.open .isl{width:480px;height:96px;border-radius:0 0 34px 34px;box-shadow:0 18px 50px rgba(0,0,0,.45)}
.closing .isl{width:190px;height:32px;border-radius:0 0 18px 18px;transition-duration:.38s;transition-timing-function:var(--soft)}
.row{position:absolute;left:0;right:0;bottom:0;height:62px;display:flex;align-items:center;gap:14px;padding:0 18px 0 16px;opacity:0;transform:translateY(-6px);transition:opacity .25s,transform .4s var(--soft)}
.open .row{opacity:1;transform:none;transition-delay:.16s}
.closing .row{opacity:0;transition-delay:0s}

/* left visual: blue voice wave  ⇄  Stash orb */
.vis{position:relative;width:96px;height:40px;flex:none;transition:width .45s var(--ease)}
.typing .vis,.thinking .vis,.answered .vis{width:34px}
#wave{position:absolute;left:0;top:0;width:96px;height:40px;transition:opacity .3s,transform .45s var(--ease);transform-origin:left center}
.typing #wave,.thinking #wave,.answered #wave{opacity:0;transform:scale(.3)}
.orb{position:absolute;left:0;top:3px;width:34px;height:34px;border-radius:50%;opacity:0;transform:scale(.2);transition:opacity .3s,transform .5s var(--ease);
  background:radial-gradient(circle at 32% 28%,#fff6d8 0%,#f3dca0 18%,#7fa8f0 46%,#2c58c8 72%,#14204a 100%);box-shadow:0 0 18px rgba(79,134,232,.55),inset 0 0 8px rgba(255,255,255,.25)}
.orb:after{content:"";position:absolute;inset:0;border-radius:50%;background:conic-gradient(from 0deg,transparent 0 60%,rgba(255,255,255,.35) 75%,transparent 90%);animation:spin 3.2s linear infinite;mix-blend-mode:screen}
.typing .orb,.thinking .orb,.answered .orb{opacity:1;transform:scale(1)}
.thinking .orb{animation:pulse 1.1s ease-in-out infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{50%{transform:scale(.86);box-shadow:0 0 30px rgba(127,176,255,.9),inset 0 0 8px rgba(255,255,255,.3)}}

.mid{flex:1;min-width:0;position:relative;height:40px;display:flex;align-items:center}
.label{font-size:14px;color:rgba(255,255,255,.72);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:opacity .2s}
.label b{color:#fff;font-weight:600}
#inp{position:absolute;inset:0;width:100%;font-size:15px;color:#fff;opacity:0;pointer-events:none;caret-color:#7fb0ff}
#inp::placeholder{color:rgba(255,255,255,.38)}
.typing #inp,.answered #inp{opacity:1;pointer-events:auto}
.typing .label,.answered .label{opacity:0}
.keys{flex:none;font-size:11px;color:rgba(255,255,255,.38);display:flex;gap:4px;align-items:center}
.keys kbd{font-family:inherit;border:1px solid rgba(255,255,255,.18);border-radius:5px;padding:1px 5px}

/* ---------- the bubble below: what you said + the answer ---------- */
.bub{margin-top:10px;width:480px;max-height:330px;overflow-y:auto;border-radius:24px;padding:14px 18px 16px;background:rgba(8,8,10,.94);border:1px solid rgba(255,255,255,.09);box-shadow:0 20px 60px rgba(0,0,0,.5);
  opacity:0;transform:translateY(-14px) scale(.96);transform-origin:top center;pointer-events:none;transition:opacity .25s,transform .45s var(--ease);user-select:text}
.bub.show{opacity:1;transform:none;pointer-events:auto}
.said{font-size:14px;color:rgba(255,255,255,.55);line-height:1.5;margin-bottom:8px}
.said:before{content:"“"}.said:after{content:"”"}
.ans{font-size:14.5px;line-height:1.6;color:#f0f0f2;white-space:pre-wrap}
.ans b{color:#fff}
.dots{display:inline-flex;gap:5px;padding:6px 0}
.dots i{width:6px;height:6px;border-radius:50%;background:#7fb0ff;animation:blink 1s infinite}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes blink{0%,100%{opacity:.25}50%{opacity:1}}
.srcs{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.src{height:26px;padding:0 10px;border-radius:8px;font-size:12px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);cursor:pointer}
.src:hover{background:rgba(255,255,255,.14)}
.src small{color:rgba(255,255,255,.45);margin-left:4px}
.hint{font-size:11.5px;color:rgba(255,255,255,.4);margin-top:10px}
.stat{font-size:12px;color:#9ab8ff;margin-top:2px}
.key{margin-top:12px;padding:12px;border-radius:14px;background:rgba(79,134,232,.1);border:1px solid rgba(127,176,255,.25)}
.kt{font-size:12.5px;line-height:1.5;color:rgba(255,255,255,.75)}
.kr{display:flex;gap:8px;margin-top:9px}
.kr input{flex:1;height:32px;padding:0 10px;border-radius:9px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14);font-size:13px;color:#fff;user-select:text}
.kr button{height:32px;padding:0 14px;border-radius:9px;background:#fff;color:#111;font-weight:600;font-size:12.5px;cursor:pointer}
.kerr{font-size:11.5px;color:#ff9d94;margin-top:6px;min-height:0}
</style>
</head>
<body>
<div class="wrap" id="root">
  <div class="isl" id="isl">
    <div class="row">
      <div class="vis"><canvas id="wave" width="192" height="80"></canvas><div class="orb"></div></div>
      <div class="mid"><div class="label" id="label">Listening…</div><input id="inp" placeholder="Ask anything — or about what's on your screen…" autocomplete="off" spellcheck="false"></div>
      <div class="keys" id="keys"><kbd>esc</kbd></div>
    </div>
  </div>
  <div class="bub" id="bub"></div>
</div>
<script type="module">
const N = window.stashNative, $ = s => document.querySelector(s);
const root = $('#root'), label = $('#label'), inp = $('#inp'), bub = $('#bub');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = t => esc(t).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/^- /gm, '• ');
let state = 'closed', openedAt = 0, busy = false;

function setState(s){
  state = s;
  root.classList.remove('listening', 'typing', 'thinking', 'answered');
  if (s !== 'closed') root.classList.add(s);
}

/* ---------- mouse: let clicks pass through the empty transparent area ---------- */
const over = v => N.islandMouse(v);
[$('#isl'), bub].forEach(el => { el.addEventListener('mouseenter', () => over(true)); el.addEventListener('mouseleave', () => over(false)); });

/* ---------- blue voice wave ---------- */
const cv = $('#wave'), cx = cv.getContext('2d');
let level = 0, target = 0;
function drawWave(t){
  const W = cv.width, H = cv.height, mid = H / 2;
  level += (target - level) * .18;
  cx.clearRect(0, 0, W, H);
  const layers = [['rgba(56,96,210,.55)', 1.0, 0], ['rgba(127,176,255,.75)', .75, 1.7], ['rgba(79,134,232,1)', .55, 3.1]];
  cx.shadowColor = '#4f86e8'; cx.shadowBlur = 10;
  for (const [col, sp, ph] of layers){
    cx.beginPath();
    for (let x = 0; x <= W; x += 2){
      const u = x / W, env = Math.pow(Math.sin(Math.PI * u), 1.6);
      const amp = (4 + level * 30) * env;
      const y = mid + Math.sin(u * 9 + t * .006 * sp + ph) * amp * .7 + Math.sin(u * 4.3 - t * .004 * sp + ph) * amp * .45;
      x ? cx.lineTo(x, y) : cx.moveTo(x, y);
    }
    cx.strokeStyle = col; cx.lineWidth = 3; cx.stroke();
  }
  requestAnimationFrame(drawWave);
}
requestAnimationFrame(drawWave);

/* ---------- speech: mic → silence detection → on-device Whisper ---------- */
let asrP = null;
function getASR(){
  if (!asrP) asrP = (async () => {
    const T = await import('https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.0.2');
    T.env.allowLocalModels = false;
    return T.pipeline('automatic-speech-recognition', 'Xenova/whisper-base.en', {
      progress_callback: p => { if (state === 'listening' && p.status === 'progress' && p.file?.endsWith('.onnx') && !speaking) label.innerHTML = `Getting voice ready… <b>${Math.round(p.progress || 0)}%</b> <span style="opacity:.6">(first time only)</span>`; }
    });
  })().catch(e => { asrP = null; throw e; });
  return asrP;
}
let stream = null, ac = null, an = null, proc = null, chunks = [], rec = false, speaking = false, lastVoice = 0, micT = 0, vadRAF = 0;
async function startListening(){
  setState('listening'); label.textContent = 'Listening…'; chunks = []; speaking = false;
  getASR().catch(() => {});   // warm the model up while you talk
  try {
    stream = await navigator.mediaDevices.getUserMedia({audio: {echoCancellation: true, noiseSuppression: true, autoGainControl: true}});
  } catch (e) { toTyping('', "Microphone is off — type instead (or allow Stash in System Settings › Privacy › Microphone)"); return; }
  if (state !== 'listening'){ stopMic(); return; }
  ac = new AudioContext(); const src = ac.createMediaStreamSource(stream);
  an = ac.createAnalyser(); an.fftSize = 1024; src.connect(an);
  proc = ac.createScriptProcessor(4096, 1, 1); src.connect(proc); proc.connect(ac.destination);
  proc.onaudioprocess = e => { if (rec) chunks.push(new Float32Array(e.inputBuffer.getChannelData(0))); };
  rec = true; micT = performance.now();
  const buf = new Float32Array(an.fftSize);
  const vad = () => {
    if (!rec) return;
    an.getFloatTimeDomainData(buf); let s = 0; for (const v of buf) s += v * v;
    const rms = Math.sqrt(s / buf.length); target = Math.min(1, rms * 9);
    const now = performance.now();
    if (rms > .025){ if (!speaking){ speaking = true; label.innerHTML = '<b>Listening…</b>'; } lastVoice = now; }
    if (speaking && now - lastVoice > 1300) return finishSpeech();
    if (!speaking && now - micT > 9000){ stopMic(); toTyping('', "Didn't hear anything — type, or press the shortcut to try again"); return; }
    if (now - micT > 25000) return finishSpeech();
    vadRAF = requestAnimationFrame(vad);
  };
  vad();
}
function stopMic(){
  rec = false; cancelAnimationFrame(vadRAF); target = 0;
  try { proc && proc.disconnect(); } catch (e) {}
  stream && stream.getTracks().forEach(t => t.stop()); ac && ac.close().catch(() => {});
  stream = ac = an = proc = null;
}
async function finishSpeech(){
  const sr = ac ? ac.sampleRate : 48000; stopMic();
  const len = chunks.reduce((a, c) => a + c.length, 0);
  if (!len){ toTyping(); return; }
  const pcm = new Float32Array(len); let o = 0; for (const c of chunks){ pcm.set(c, o); o += c.length; }
  label.innerHTML = '<b>Got it</b> — writing that down…';
  showBubble(`<div class="ans"><span class="dots"><i></i><i></i><i></i></span></div>`);
  try {
    // Whisper wants 16 kHz mono
    const oc = new OfflineAudioContext(1, Math.ceil(len * 16000 / sr), 16000);
    const b = oc.createBuffer(1, len, sr); b.copyToChannel(pcm, 0);
    const s = oc.createBufferSource(); s.buffer = b; s.connect(oc.destination); s.start();
    const audio = (await oc.startRendering()).getChannelData(0);
    const asr = await getASR();
    const out = await asr(audio);
    const text = (out.text || '').replace(/\[[^\]]*\]|\([^)]*\)/g, '').trim();
    if (!text){ toTyping('', "Didn't catch that — try typing it"); hideBubble(); return; }
    submit(text);
  } catch (e) {
    toTyping('', 'Voice needs a quick download the first time and an internet connection — type for now');
    hideBubble();
  }
}

/* ---------- typing mode: the wave morphs into the Stash orb ---------- */
function toTyping(seed = '', note = ''){
  stopMic(); setState('typing');
  inp.value = seed; inp.placeholder = note || 'Ask Stash anything…';
  inp.focus(); inp.setSelectionRange(inp.value.length, inp.value.length);
}
addEventListener('keydown', e => {
  if (e.key === 'Escape'){ e.preventDefault(); close(); return; }
  // start typing at any point and the wave turns into the Stash orb (the key lands in the box)
  if (state === 'listening' && e.key.length === 1 && !e.metaKey && !e.ctrlKey){ if (document.activeElement !== inp) toTyping(); return; }
  if (state === 'listening' && e.key === 'Enter' && speaking){ e.preventDefault(); finishSpeech(); }
});
inp.addEventListener('keydown', e => { if (e.key === 'Enter' && inp.value.trim()){ e.preventDefault(); submit(inp.value.trim()); } });

/* ---------- asking Stash ---------- */
function showBubble(html){ bub.innerHTML = html; bub.classList.add('show'); }
function hideBubble(){ bub.classList.remove('show'); }
async function submit(text){
  if (busy) return; busy = true;
  inp.value = ''; setState('thinking'); label.textContent = 'Thinking…';
  showBubble(`<div class="said">${esc(text)}</div><div class="ans"><span class="dots"><i></i><i></i><i></i></span></div>`);
  let r;
  try { r = N.aiAsk ? await N.aiAsk(text) : await N.islandCommand(text); } catch (e) { r = null; }
  busy = false; lastQ = text;
  if (!r){ showBubble(`<div class="said">${esc(text)}</div><div class="ans">Stash isn't running its main window right now — open it and try again.</div>`); setState('answered'); return; }
  const src = (r.sources || []).map(s => `<button class="src" data-id="${esc(s.id)}">${esc(s.title)}<small>${esc(s.folder)}</small></button>`).join('');
  // without Claude connected, plain questions get a library-only answer + a way to connect
  const connect = r.needsKey ? `<div class="key"><div class="kt"><b>Turn on full AI</b> — answers anything and can see your screen. Paste your Anthropic API key (console.anthropic.com › API Keys):</div><div class="kr"><input id="keyIn" type="password" placeholder="sk-ant-…" autocomplete="off"><button id="keyGo">Connect</button></div><div class="kerr" id="keyErr"></div></div>` : '';
  showBubble(`<div class="said">${esc(text)}</div><div class="ans">${fmt(r.text || '')}</div>${src ? `<div class="srcs">${src}</div>` : ''}${connect}<div class="hint">Type a follow-up, or press the shortcut again to talk</div>`);
  if (r.needsKey) wireKey();
  setState('answered'); inp.placeholder = 'Ask a follow-up…';
  setTimeout(() => inp.focus(), 30);
  if (r.open) setTimeout(() => N.islandOpenItem(r.open), 700);
}
let lastQ = '';
function wireKey(){
  const k = $('#keyIn'), go = $('#keyGo'), err = $('#keyErr');
  const connect = async () => {
    if (!k.value.trim()) return k.focus();
    go.textContent = 'Checking…'; go.disabled = true; err.textContent = '';
    const r = await N.aiSetKey(k.value.trim());
    if (!r.ok){ go.textContent = 'Connect'; go.disabled = false; err.textContent = r.error || "That key didn't work."; return; }
    if (lastQ) submit(lastQ);   // ask again, this time with Claude
  };
  go.onclick = connect; k.onkeydown = e => { if (e.key === 'Enter'){ e.preventDefault(); e.stopPropagation(); connect(); } };
}
N.onIslandStatus?.(msg => { const d = bub.querySelector('.ans .dots'); if (d && state === 'thinking'){ let l = bub.querySelector('.stat'); if (!l){ l = document.createElement('div'); l.className = 'stat'; d.after(l); } l.textContent = msg; } });
bub.addEventListener('click', e => { const b = e.target.closest('.src'); if (b) N.islandOpenItem(b.dataset.id); });

/* ---------- open / close ---------- */
function open(){
  root.classList.remove('closing'); hideBubble(); busy = false; openedAt = Date.now();
  requestAnimationFrame(() => root.classList.add('open'));
  setTimeout(startListening, 180);
}
function close(){
  stopMic(); hideBubble(); root.classList.add('closing');
  setTimeout(() => { root.classList.remove('open', 'closing'); setState('closed'); N.islandClose(); }, 360);
}
N.islandKey?.().then(k => { if (k) $('#keys').innerHTML = `<kbd>${esc(k)}</kbd><kbd>esc</kbd>`; }).catch(() => {});
N.onIslandOpen(open);
// pressing the shortcut while open: finish talking now, or start talking again
N.onIslandHotkey(() => {
  if (state === 'listening'){ speaking ? finishSpeech() : close(); }
  else if (state === 'typing' || state === 'answered'){ hideBubble(); startListening(); }
});
N.onIslandBlur(() => { if (Date.now() - openedAt > 1500 && state !== 'thinking') close(); });
</script>
</body>
</html>
